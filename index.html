const LAST_BUFFER = 120; // minutes a final act stays "live"
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

/* ---------------- JST clock ---------------- */
function jstParts(){
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  let hh = g("hour"); if (hh === "24") hh = "00";
  return { date:`${g("year")}-${g("month")}-${g("day")}`, min: Number(hh)*60 + Number(g("minute")), hh, mm:g("minute") };
}

/* returns {liveIdx, nextIdx} for a set given current JST, or nulls if not that day */
function status(set, isToday, nowMin){
  if (!isToday) return { liveIdx:-1, nextIdx:-1, isToday:false };
  let liveIdx = -1;
  for (let i=0;i<set.length;i++){ if (toMin(set[i].t) <= nowMin) liveIdx = i; }
  if (liveIdx >= 0){
    const end = (liveIdx < set.length-1) ? toMin(set[liveIdx+1].t) : toMin(set[liveIdx].t)+LAST_BUFFER;
    if (nowMin >= end && liveIdx === set.length-1) liveIdx = -2; // finished for the day
  }
  let nextIdx = -1;
  for (let i=0;i<set.length;i++){ if (toMin(set[i].t) > nowMin){ nextIdx = i; break; } }
  return { liveIdx, nextIdx, isToday:true };
}

  if (now.date < DAYS[0].date) return DAYS[0];
  if (now.date > DAYS[DAYS.length-1].date) return DAYS[DAYS.length-1];
  return DAYS[0];
}

/* ---------------- render: days ---------------- */
function renderDays(){
  $("days").innerHTML = DAYS.map(d =>
    `<button class="day" data-day="${d.id}" role="button" aria-pressed="${d.id===curDay.id}"
       style="--dayc:${d.accent}">
       <span class="n">${d.num}</span><span class="w">${d.w}</span></button>`
  ).join("");
  $("days").querySelectorAll(".day").forEach(b =>
    b.onclick = () => setDay(DAYS.find(d=>d.id===b.dataset.day)));
}

function setDay(d){
  curDay = d;
  document.documentElement.style.setProperty("--accent", d.accent);
  $("days").querySelectorAll(".day").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.day===d.id));
  $("nnDay").textContent = `${d.num} ${d.w.toUpperCase()}`;
  $("ttDay").textContent = `${d.num} ${d.w.toUpperCase()}`;
  renderTabs(); renderNowNext(); renderTimetable();
}

/* ---------------- render: channel tabs ---------------- */
function renderTabs(){
  const now = jstParts();
  const isToday = curDay.date === now.date;
  $("tabs").innerHTML = CHORDER.map(id => {
    const c = CH[id], st = status(curDay.sets[id], isToday, now.min);
    let nowTxt = "";
    if (st.liveIdx >= 0) nowTxt = `🔴 ${curDay.sets[id][st.liveIdx].a}`;
    else if (st.isToday && st.nextIdx >= 0) nowTxt = `Next · ${curDay.sets[id][st.nextIdx].t} ${curDay.sets[id][st.nextIdx].a}`;
    else nowTxt = "Schedule below";
    return `<button class="tab" role="tab" data-ch="${id}" aria-selected="${id===curChannel}" style="--chc:${c.color}">
      <span class="lbl"><span style="color:${c.color}">${c.name.replace('Channel','CH')}</span> <span class="ch">${c.login}</span></span>
      <span class="now">${esc(nowTxt)}</span>
    </button>`;
  }).join("");
  $("tabs").querySelectorAll(".tab").forEach(t =>
    t.onclick = () => setChannel(t.dataset.ch));
}

function setChannel(id, scroll=false){
  curChannel = id;
  const login = CH[id].login;
  $("player").src = playerSrc(login);
  if ($("stagegrid").classList.contains("chat-on")) $("chat").src = chatSrc(login);
  $("tabs").querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.ch===id));
  updateStageNow();
  if (scroll) window.scrollTo({ top:0, behavior:"smooth" });
}

function updateStageNow(){
  const now = jstParts();
  const isToday = curDay.date === now.date;
  const st = status(curDay.sets[curChannel], isToday, now.min);
  const set = curDay.sets[curChannel], c = CH[curChannel];
  let html = `<b>${c.name}</b> · ${c.login} — `;
  if (st.liveIdx >= 0) html += `<span class="badge-live"><span class="live-dot"></span>LIVE</span> ${esc(set[st.liveIdx].a)}`;
  else if (isToday && st.nextIdx >= 0) html += `Up next ${set[st.nextIdx].t} · ${esc(set[st.nextIdx].a)}`;
  else if (isToday) html += `<span class="offair">Day finished</span>`;
  else html += `<span class="offair">Not streaming right now — see timetable</span>`;
  $("stageNow").innerHTML = html;
}

/* ---------------- render: now & next ---------------- */
function renderNowNext(){
  const now = jstParts();
  const isToday = curDay.date === now.date;
  $("nowNext").innerHTML = CHORDER.map(id => {
    const c = CH[id], set = curDay.sets[id];
    const st = status(set, isToday, now.min);
    let head, sub = "", nxt = "";
    if (st.liveIdx >= 0){
      head = `<span class="cap"><span class="chn">${c.name.replace('Channel','CH')}</span> · <span class="badge-live"><span class="live-dot"></span>ON NOW</span></span>`;
      sub  = set[st.liveIdx].sub ? `<div class="sub">${esc(set[st.liveIdx].sub)}</div>` : "";
      var art = set[st.liveIdx].a;
      if (st.nextIdx >= 0) nxt = `<div class="nxt">Next <b>${set[st.nextIdx].t}</b> · ${esc(set[st.nextIdx].a)}</div>`;
    } else if (isToday && st.nextIdx >= 0){
      head = `<span class="cap"><span class="chn">${c.name.replace('Channel','CH')}</span> · Up next</span>`;
      var art = set[st.nextIdx].a;
      sub = `<div class="sub">Starts ${set[st.nextIdx].t} JST</div>`;
    } else {
      head = `<span class="cap"><span class="chn">${c.name.replace('Channel','CH')}</span> · ${isToday ? "Finished" : "First act"}</span>`;
      var art = isToday ? "—" : set[0].a;
      if (!isToday) sub = `<div class="sub">${set[0].t} JST · ${c.login}</div>`;
    }
    return `<div class="nncard" data-ch="${id}" style="--chc:${c.color}">
      ${head}<div class="art">${esc(art)}</div>${sub}${nxt}</div>`;
  }).join("");
  $("nowNext").querySelectorAll(".nncard").forEach(el =>
    el.onclick = () => setChannel(el.dataset.ch, true));
}

/* ---------------- render: timetable ---------------- */
function renderTimetable(){
  const now = jstParts();
  const isToday = curDay.date === now.date;
  const dayPast = curDay.date < now.date;
  $("timetable").innerHTML = CHORDER.map(id => {
    const c = CH[id], set = curDay.sets[id];
    const st = status(set, isToday, now.min);
    const rows = set.map((s,i) => {
      let cls = "slot";
      let tag = "";
      if (isToday){
        if (i === st.liveIdx){ cls += " live"; tag = `<span class="livetag"><span class="live-dot"></span>LIVE</span>`; }
        else if (st.liveIdx === -2 || (st.liveIdx>=0 ? i<st.liveIdx : toMin(s.t) < now.min)) cls += " past";
      } else if (dayPast){ cls += " past"; }
      return `<div class="${cls}" data-ch="${id}">
        <div class="tm">${s.t}</div>
        <div><div class="art">${esc(s.a)}${tag}</div>${s.sub?`<div class="sub">${esc(s.sub)}</div>`:""}</div>
      </div>`;
    }).join("");
    return `<div class="col" style="--chc:${c.color}">
      <button class="colhead" data-ch="${id}">
        <span class="num">${c.name.replace('Channel ','')}</span>
        <span class="meta"><b>${c.name}</b><small>${c.login}</small></span>
        <span class="play">▶ Watch</span>
      </button>${rows}</div>`;
  }).join("");
  $("timetable").querySelectorAll(".colhead").forEach(h =>
    h.onclick = () => setChannel(h.dataset.ch, true));
  $("timetable").querySelectorAll(".slot").forEach(s =>
    s.onclick = () => setChannel(s.dataset.ch, true));
}

/* ---------------- chat toggle ---------------- */
$("chatBtn").onclick = () => {
  const on = $("stagegrid").classList.toggle("chat-on");
  $("chatBtn").setAttribute("aria-pressed", on);
  if (on && !$("chat").src) $("chat").src = chatSrc(CH[curChannel].login);
};

/* ---------------- file:// guard ---------------- */
function checkHost(){
  if (location.protocol === "file:"){
    const n = $("notice");
    n.classList.add("show");
    n.innerHTML = `⚠️ Twitch won't load from a local file. Serve this page over http(s) — e.g. run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000/fujirock-live.html</code>, or host it on your own domain. Twitch is allow-listed to the page's <code>parent=</code> domain, currently <code>${esc(host())}</code>.`;
  }
}

/* ---------------- tick ---------------- */
function tick(){
  const j = jstParts();
  $("clock").textContent = `${j.hh}:${j.mm}`;
  renderTabs(); renderNowNext(); renderTimetable(); updateStageNow();
}

/* ---------------- boot ---------------- */
curDay = pickInitialDay();
renderDays();
setDay(curDay);
setChannel("ch1");
checkHost();
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
